<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 525 130" fill="none">
  <!-- D: green spine + lime right-arc -->
  <rect x="0" y="0" width="30" height="130" rx="3" fill="#3A7A50"/>
  <path d="M30,0 A65,65 0 0,1 30,130 Z" fill="#C9E052"/>

  <!-- U: red top rect + pink bottom arc -->
  <rect x="125" y="0" width="120" height="66" rx="3" fill="#D44E30"/>
  <path d="M125,66 A60,60 0 0,0 245,66 Z" fill="#F3A3C0"/>

  <!-- S top: blue right-facing D -->
  <path d="M260,0 L342,0 A42,42 0 0,1 342,58 L260,58 Z" fill="#4A80EE"/>
  <!-- S bottom: light-blue left-facing D (smaller) -->
  <path d="M342,67 L372,67 L372,127 L342,127 A38,38 0 0,0 342,67 Z" fill="#90C4F2"/>

  <!-- T: blue wide cap + orange stem -->
  <path d="M385,0 L483,0 A45,45 0 0,1 483,60 L385,60 Z" fill="#4A80EE"/>
  <rect x="420" y="68" width="62" height="58" rx="3" fill="#F5A820"/>
